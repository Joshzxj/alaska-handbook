        <style>
            :root {
                --night: #030710;
                --aurora-green: #46f2a6;
                --aurora-teal: #3cd6d0;
                --ice-text: #eef6f3;
                --display: "Didot", "Bodoni 72", "Playfair Display", Georgia, "Songti SC", serif;
                --mono: ui-monospace, "SF Mono", "Menlo", "Consolas", monospace;
                --sans: -apple-system, system-ui, "PingFang SC", sans-serif;
            }
            * {
                box-sizing: border-box;
            }
            .staticrypt-html {
                height: 100%;
            }
            .staticrypt-body {
                min-height: 100vh;
                min-height: 100svh;
                margin: 0;
                background: var(--night);
                color: var(--ice-text);
                font-family: var(--sans);
                -webkit-font-smoothing: antialiased;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px 18px;
            }

            /* ---------- scene: photo, scrim, living aurora glow ---------- */
            .scene {
                position: fixed;
                inset: 0;
                overflow: hidden;
                pointer-events: none;
            }
            .photo {
                position: absolute;
                inset: -5%;
                background: url("img/aurora-alaska-range.jpg") center / cover no-repeat;
                animation: kenburns 42s ease-in-out infinite alternate;
                will-change: transform;
            }
            @keyframes kenburns {
                from {
                    transform: scale(1);
                }
                to {
                    transform: scale(1.09) translateY(-1.5%);
                }
            }
            .scrim {
                position: absolute;
                inset: 0;
                background: linear-gradient(180deg, rgba(3, 7, 16, 0.5), rgba(3, 7, 16, 0.18) 42%, rgba(3, 7, 16, 0.66)),
                    radial-gradient(120% 90% at 50% 50%, transparent 55%, rgba(3, 7, 16, 0.55));
            }
            .aur {
                position: absolute;
                border-radius: 50%;
                filter: blur(70px);
                mix-blend-mode: screen;
                will-change: transform, opacity;
            }
            .aur-1 {
                width: 110vmax;
                height: 32vmax;
                left: -22vmax;
                top: -8vmax;
                background: radial-gradient(closest-side, rgba(70, 242, 166, 0.26), transparent);
                transform: rotate(-14deg);
                animation: drift-1 24s ease-in-out infinite alternate;
            }
            .aur-2 {
                width: 85vmax;
                height: 28vmax;
                right: -28vmax;
                top: 0;
                background: radial-gradient(closest-side, rgba(60, 214, 208, 0.2), transparent);
                transform: rotate(10deg);
                animation: drift-2 32s ease-in-out infinite alternate;
            }
            @keyframes drift-1 {
                to {
                    transform: rotate(-7deg) translate(7vmax, 4vmax) scaleY(1.3);
                    opacity: 0.65;
                }
            }
            @keyframes drift-2 {
                to {
                    transform: rotate(15deg) translate(-9vmax, 5vmax) scaleY(0.8);
                    opacity: 0.7;
                }
            }

            /* ---------- glass card ---------- */
            .card {
                position: relative;
                z-index: 5;
                width: min(400px, 100%);
                padding: 56px 44px 46px;
                text-align: center;
                background: linear-gradient(165deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.04));
                -webkit-backdrop-filter: blur(22px) saturate(150%);
                backdrop-filter: blur(22px) saturate(150%);
                border: 1px solid rgba(255, 255, 255, 0.18);
                border-radius: 24px;
                box-shadow: 0 30px 80px rgba(2, 6, 16, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.25);
                animation: rise 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) both;
            }
            @keyframes rise {
                from {
                    opacity: 0;
                    transform: translateY(22px);
                }
                to {
                    opacity: 1;
                    transform: none;
                }
            }
            h1 {
                font-family: var(--display);
                font-weight: 400;
                font-size: clamp(30px, 7.5vw, 40px);
                letter-spacing: 0.32em;
                padding-left: 0.32em; /* recenter tracked uppercase */
                white-space: nowrap; /* background-clip:text turns overflowing glyphs invisible */
                margin: 0 0 38px;
                background: linear-gradient(180deg, #ffffff 15%, #b6e6d2 95%);
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
            }
            .staticrypt-password-container {
                position: relative;
            }
            input#staticrypt-password {
                width: 100%;
                padding: 15px 44px;
                text-align: center;
                font-family: var(--mono);
                font-size: 15px;
                letter-spacing: 0.06em;
                color: var(--ice-text);
                background: rgba(255, 255, 255, 0.08);
                border: 1px solid rgba(255, 255, 255, 0.16);
                border-radius: 14px;
                outline: 0;
                transition: border-color 0.25s, box-shadow 0.25s, background-color 0.25s;
            }
            input#staticrypt-password:focus {
                border-color: rgba(70, 242, 166, 0.55);
                background: rgba(255, 255, 255, 0.11);
                box-shadow: 0 0 0 4px rgba(70, 242, 166, 0.12);
            }
            input#staticrypt-password::placeholder {
                color: rgba(238, 246, 243, 0.4);
                font-family: var(--sans);
                letter-spacing: 0.14em;
                font-size: 13px;
            }
            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 16px;
                width: 16px;
                padding: 14px;
                position: absolute;
                right: 2px;
                top: 50%;
                transform: translateY(-50%);
                filter: invert(1);
                opacity: 0.35;
                transition: opacity 0.2s;
            }
            .staticrypt-toggle-password-visibility:hover {
                opacity: 0.7;
            }
            label.staticrypt-remember {
                display: none !important; /* stays checked invisibly — cross-page unlock keeps working */
            }
            .staticrypt-decrypt-button {
                width: 100%;
                margin-top: 16px;
                padding: 15px;
                border: 0;
                border-radius: 14px;
                cursor: pointer;
                font-family: var(--mono);
                font-size: 12px;
                font-weight: 600;
                letter-spacing: 0.34em;
                text-indent: 0.34em; /* recenter tracked uppercase */
                text-transform: uppercase;
                color: #04231a;
                background: linear-gradient(120deg, var(--aurora-green), var(--aurora-teal));
                box-shadow: 0 8px 30px rgba(70, 242, 166, 0.3);
                transition: filter 0.2s, box-shadow 0.2s, transform 0.2s;
            }
            .staticrypt-decrypt-button:hover,
            .staticrypt-decrypt-button:focus {
                filter: brightness(1.08);
                box-shadow: 0 10px 38px rgba(70, 242, 166, 0.45);
                transform: translateY(-1px);
            }
            .staticrypt-decrypt-button:focus-visible,
            input#staticrypt-password:focus-visible {
                outline: 2px solid rgba(70, 242, 166, 0.8);
                outline-offset: 2px;
            }
            #staticrypt-error {
                margin: 18px 0 0;
                font-size: 12.5px;
                letter-spacing: 0.02em;
                color: #ffb38a;
            }

            .hidden {
                display: none !important;
            }
            .staticrypt-spinner-container {
                position: fixed;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                background: var(--night);
                z-index: 10;
            }
            .staticrypt-spinner {
                width: 1.8rem;
                height: 1.8rem;
                border: 0.22em solid rgba(255, 255, 255, 0.12);
                border-right-color: var(--aurora-green);
                border-radius: 50%;
                animation: spinner-border 0.8s linear infinite;
            }
            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }

            @media (prefers-reduced-motion: reduce) {
                .photo,
                .aur,
                .card {
                    animation: none;
                }
                .staticrypt-spinner {
                    animation-duration: 2.4s;
                }
            }
            @media (max-width: 420px) {
                .card {
                    padding: 46px 28px 36px;
                }
            }
        </style>
